services:
  # ---------- FRONTEND (DEV) ----------
  frontend:
    build:
      context: ./Frontend          # uses the same Dockerfile you already have
    ports:
      - "5173:5173"               # host port 5173 → container Vite dev server
    volumes:
      - ./Frontend:/app            # live‑edit source code
      - node_modules_frontend:/app/node_modules  # preserve node_modules

    command: ["npm", "run", "dev"]
    depends_on:
      - backend                     # optional, only needed if you want the API reachable from Vite

  # ---------- BACKEND ----------
  backend:
    build:
      context: ./Backend
    ports:
      - "3000:3000"          # optional – only needed if you want to hit the API directly
    volumes:
      - ./Backend:/app
      - /app/node_modules
    env_file: ./Backend/.env   # ensures DB_HOST=postgres etc.
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/mydb
    depends_on:
      - postgres

  # ---------- POSTGRES ----------
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql   # <-- mount at the version‑aware root (recommended)

  # ---------- NGINX (serves static files + API proxy) ----------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf   # your proxy + static‑file config
      - ./Frontend/dist:/usr/share/nginx/html           # <-- built React app
    depends_on:
      - backend                                        # backend must be up before nginx starts

volumes:
  postgres_data:
  node_modules_frontend:
